<!DOCTYPE html>
<!-- saved from url=(0031)https://pi.justind.kim/monitor/ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --paper:#E8EBEE;
    --panel:#F5F7F8;
    --ink:#1A2730;
    --muted:#6B7B87;
    --rule:#C6CED4;
    --live:#1D4FD8;
    --warm:#B4611A;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#11161A;
      --panel:#1A2128;
      --ink:#E3E9EE;
      --muted:#8695A1;
      --rule:#2B343D;
      --live:#6E9BFF;
      --warm:#E09447;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif}
  .or-root{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding:28px 24px 40px;
    max-width:1000px;
    margin:0 auto;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  /* ---- gate ---- */
  .gate{max-width:520px}
  .gate h1{font-size:26px;font-weight:600;margin:0 0 8px;letter-spacing:-0.01em}
  .gate p{color:var(--muted);margin:0 0 20px}
  .field{display:flex;gap:8px;flex-wrap:wrap}
  input[type=password],input[type=text]{
    flex:1 1 260px;min-width:0;padding:11px 12px;border:1px solid var(--rule);
    border-radius:3px;background:var(--panel);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  input:focus-visible,button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
  button{
    font:inherit;font-weight:500;padding:11px 18px;border:1px solid var(--ink);
    background:var(--ink);color:var(--panel);border-radius:3px;cursor:pointer;
  }
  button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  button:disabled{opacity:.45;cursor:default}
  .note{font-size:13px;color:var(--muted);margin-top:14px;border-left:2px solid var(--rule);padding-left:12px}
  .err{margin-top:16px;padding:12px 14px;background:var(--panel);border-left:3px solid var(--warm);font-size:14px}
  .err b{display:block;margin-bottom:4px}

  /* ---- meter ---- */
  .meter{margin-bottom:6px}
  .meter-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .rate{font-size:clamp(44px,9vw,76px);font-weight:500;letter-spacing:-0.03em;line-height:1}
  .rate small{font-size:.32em;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:.35em}
  .rate-label{color:var(--muted);font-size:14px;margin-bottom:6px}
  .facts{display:flex;gap:28px;flex-wrap:wrap;text-align:right}
  .fact-v{font-size:20px;font-weight:500}
  .fact-k{font-size:12px;color:var(--muted)}
  .spark{width:100%;height:110px;display:block;margin-top:14px}
  .tick{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
  .dot.on{animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){
    .dot.on{animation:none}
    .spark rect,.bars rect,.track i,.tip{transition:none;animation:none}
  }

  /* chart motion: bars keep their identity across polls so CSS can tween them */
  .spark rect{transition:y .55s cubic-bezier(.22,.8,.25,1),height .55s cubic-bezier(.22,.8,.25,1),opacity .35s ease}
  .spark rect:hover,.bars rect:hover{fill:var(--warm)}
  .bars rect{transform-box:fill-box;transform-origin:bottom;animation:grow .5s cubic-bezier(.22,.8,.25,1) backwards;transition:fill .15s}
  @keyframes grow{from{transform:scaleY(0)}}
  .track i{transform-box:fill-box;transform-origin:left;animation:slide .6s cubic-bezier(.22,.8,.25,1) backwards;transition:width .4s cubic-bezier(.22,.8,.25,1)}
  @keyframes slide{from{transform:scaleX(0)}}

  hr.rule{border:0;border-top:1px solid var(--rule);margin:30px 0 22px}
  h2{font-size:16px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}

  .bars{width:100%;height:170px;display:block}
  .models{margin-top:6px}
  .row{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
  .row:last-child{border-bottom:0}
  .mname{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msub{font-size:12px;color:var(--muted)}
  .track{height:3px;background:var(--rule);margin-top:5px}
  .track i{display:block;height:3px;background:var(--live)}
  .mval{text-align:right;font-size:14px}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)}
  .controls label{font-size:13px;color:var(--muted)}
  input[type=range]{accent-color:var(--live);width:150px;height:22px;cursor:pointer}
  .controls .ivlabel{font-size:13px;color:var(--ink);font-family:'IBM Plex Mono',monospace;min-width:44px}
  .empty{color:var(--muted);font-size:14px;background:var(--panel);padding:14px;border-left:2px solid var(--rule)}

  /* native <title> waits ~1s and can't be sized — so, our own */
  .tip{
    position:fixed;left:0;top:0;z-index:10;pointer-events:none;
    background:var(--ink);color:var(--paper);padding:9px 12px;border-radius:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;
    visibility:hidden;opacity:0;transition:opacity .07s linear;
  }
  .tip.on{visibility:visible;opacity:1}
  .tip b{display:block;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
         font-size:21px;font-weight:600;letter-spacing:-0.01em}
  .tip span{display:block;font-size:13px;line-height:1.5;opacity:.72;margin-top:1px}
</style>

</head><body><div class="or-root" id="root">
      <div class="gate">
        <h1>OpenRouter usage, live</h1>
        <p>Paste a key to watch your credit balance draw down in real time.</p>
        <div class="field">
          <input id="key" type="password" aria-label="OpenRouter API key" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
          <button id="go">Start watching</button>
        </div>
        <p class="note">The key stays in this page's memory only — nothing is saved or sent anywhere but openrouter.ai. Closing the tab clears it. A management key also unlocks the 30-day history.</p>
        
      </div></div>

<script>
const API = 'https://openrouter.ai/api/v1';
const S = {
  key:null, credits:null, activity:null, activityErr:null,
  samples:[],           // {t, used}
  interval:15000, timer:null, running:false, err:null, busy:false, since:null, usedAtStart:null,
  morphValues:{}, morphCurrent:{}, torph:null
};
const $ = id => document.getElementById(id);
const IVS = [5,15,30,60,300];
const ivText = ms => { const s = ms/1000; return s<60 ? s+'s' : (s/60)+' min'; };
const torphReady = import('https://esm.sh/torph@0.0.9')
  .then(mod => { S.torph = mod; animateReadouts(); })
  .catch(() => null);
const money = n => (n==null||isNaN(n)) ? '—' : '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:n<1?4:2});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function animateReadouts(values=S.morphCurrent){
  S.morphCurrent = {...S.morphCurrent, ...values};
  for(const [key, value] of Object.entries(values)){
    const el = document.querySelector(`[data-torph="${key}"]`);
    if(!el) continue;
    const next = String(value);
    const previous = S.morphValues[key];
    el.textContent = previous ?? next;
    if(S.torph && previous != null && previous !== next){
      const morph = new S.torph.TextMorph({
        element: el,
        duration: 520,
        ease: {stiffness: 180, damping: 20},
        respectReducedMotion: true
      });
      morph.update(next);
    }else{
      el.textContent = next;
    }
    S.morphValues[key] = next;
  }
}

async function api(path, key){
  const r = await fetch(API+path, {headers:{Authorization:'Bearer '+key}});
  if(!r.ok){
    let msg = r.status+' '+r.statusText;
    try{const j=await r.json(); if(j.error?.message) msg=j.error.message;}catch(e){}
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.json();
}

async function connect(){
  const key = $('key').value.trim();
  if(!key || S.busy) return;
  S.busy = true; S.err = null; render();
  try{
    const c = await api('/credits', key);
    S.key = key; S.credits = c.data || c;
    S.since = Date.now();
    S.usedAtStart = usedNow();
    S.samples = [{t:Date.now(), used:usedNow()}];
    loadActivity();
    start();
  }catch(e){
    S.err = (e instanceof TypeError)
      ? 'The browser blocked the request to openrouter.ai. Serve this file over http:// instead of opening it from disk.'
      : e.message;
  }
  S.busy = false; render();
}

function usedNow(){
  const c = S.credits || {};
  return Number(c.total_usage ?? c.totalUsage ?? 0);
}
function grantedNow(){
  const c = S.credits || {};
  return Number(c.total_credits ?? c.totalCredits ?? 0);
}

async function loadActivity(){
  try{
    const a = await api('/activity', S.key);
    S.activity = a.data || [];
    S.activityErr = null;
  }catch(e){
    S.activity = null;
    S.activityErr = (e.status===401||e.status===403)
      ? 'Daily history needs a management key (Settings → Provisioning keys). Your key still drives the live meter above.'
      : e.message;
  }
  render();
}

async function poll(){
  if(!S.key) return;
  try{
    const c = await api('/credits', S.key);
    S.credits = c.data || c;
    S.samples.push({t:Date.now(), used:usedNow()});
    if(S.samples.length > 720) S.samples.shift();
    S.err = null;
  }catch(e){
    // a rejected key would otherwise 401 forever at the poll interval
    if(e.status===401 || e.status===403){ stop(); S.err = e.message+' — polling stopped.'; }
    else S.err = e.message;
  }
  paint();
}

function start(){ stop(); S.running = true; S.timer = setInterval(poll, S.interval); }
function stop(){ S.running = false; if(S.timer) clearInterval(S.timer); S.timer = null; }

// spend in the trailing window, extrapolated to an hourly rate
function burnRate(){
  if(S.samples.length < 2) return null;
  const now = Date.now();
  const win = Math.max(10*60*1000, S.interval*8);
  const inWin = S.samples.filter(s => now - s.t <= win);
  const a = (inWin.length>1 ? inWin[0] : S.samples[0]);
  const b = S.samples[S.samples.length-1];
  const hrs = (b.t - a.t)/3600000;
  if(hrs <= 0) return null;
  return (b.used - a.used)/hrs;
}

// spend per poll tick, newest bar pinned to the right, history scrolling off the left
const SLOTS = 120;
const SPARK_W = 1000, SPARK_H = 110, SPARK_PAD = 6;

// ponytail: fixed pool of rects, mutated in place — that's what lets CSS tween them
function paintSpark(){
  const g = $('sparkbars');
  if(!g) return;
  const bw = SPARK_W/SLOTS, h = SPARK_H, pad = SPARK_PAD;
  if(g.childElementCount !== SLOTS){
    g.innerHTML = Array.from({length:SLOTS},(_,i)=>
      `<rect x="${(i*bw + bw*0.15).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" `
      + `y="${h-pad}" height="0" opacity="0" fill="var(--live)"/>`).join('');
  }
  const win = S.samples.slice(-(SLOTS+1));
  const deltas = win.slice(1).map((s,i)=> Math.max(0, s.used - win[i].used));
  const max = Math.max(...deltas, 1e-9);
  const offset = SLOTS - deltas.length;
  for(let slot=0; slot<SLOTS; slot++){
    const i = slot - offset;
    const r = g.children[slot];
    const v = i>=0 ? deltas[i] : null;
    const bh = v==null ? 0 : Math.max((v/max)*(h - pad*2), 0.6);
    r.setAttribute('y', (h - pad - bh).toFixed(1));
    r.setAttribute('height', bh.toFixed(2));
    r.setAttribute('opacity', v==null ? 0 : (v>0 ? 1 : 0.35));
    if(v==null){ r.removeAttribute('data-tip'); }
    else{ r.dataset.tip = money(v); r.dataset.tipWhen = new Date(win[i+1].t).toLocaleTimeString(); }
  }
  $('sparkmax').textContent = deltas.length ? money(max) : '—';
}

function dailyBars(){
  const byDay = {};
  for(const r of S.activity){
    const d = r.date;
    byDay[d] = (byDay[d]||0) + Number(r.usage||0);
  }
  const days = Object.keys(byDay).sort();
  if(!days.length) return '<p class="empty">No activity in the last 30 days.</p>';
  const w = 1000, h = 170, bottom = 22;
  const max = Math.max(...days.map(d=>byDay[d]), 0.0001);
  const bw = w/days.length;
  let bars = '', labels = '';
  days.forEach((d,i)=>{
    const bh = (byDay[d]/max)*(h-bottom-6);
    const bx = i*bw + bw*0.14, bwid = bw*0.72;
    bars += `<rect x="${bx.toFixed(1)}" y="${(h-bottom-bh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(bh,0.6).toFixed(1)}" fill="var(--ink)" style="animation-delay:${i*18}ms" data-tip="${money(byDay[d])}" data-tip-when="${esc(d)}"/>`;
    if(i===0 || i===days.length-1 || i===Math.floor(days.length/2)){
      const anchor = i===0?'start':(i===days.length-1?'end':'middle');
      const tx = i===0?2:(i===days.length-1?w-2:bx+bwid/2);
      labels += `<text x="${tx}" y="${h-6}" font-size="11" fill="var(--muted)" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace">${d.slice(5)}</text>`;
    }
  });
  const total = days.reduce((s,d)=>s+byDay[d],0);
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Daily spend, last 30 days">
    <line x1="0" y1="${h-bottom}" x2="${w}" y2="${h-bottom}" stroke="var(--rule)"/>${bars}${labels}</svg>
    <p class="sub" style="margin-top:8px">Peak day ${money(max)} · 30-day total ${money(total)}</p>`;
}

function modelRows(){
  const by = {};
  for(const r of S.activity){
    const k = r.model || 'unknown';
    by[k] = by[k] || {usage:0, req:0, tin:0, tout:0};
    by[k].usage += Number(r.usage||0);
    by[k].req += Number(r.requests||0);
    by[k].tin += Number(r.prompt_tokens||0);
    by[k].tout += Number(r.completion_tokens||0);
  }
  const rows = Object.entries(by).sort((a,b)=>b[1].usage-a[1].usage).slice(0,10);
  if(!rows.length) return '';
  const max = rows[0][1].usage || 1;
  return rows.map(([m,v],i)=>`
    <div class="row">
      <div>
        <div class="mname">${esc(m)}</div>
        <div class="msub num">${v.req.toLocaleString()} calls · ${(v.tin/1000).toFixed(0)}k in · ${(v.tout/1000).toFixed(0)}k out</div>
        <div class="track"><i style="width:${(v.usage/max*100).toFixed(1)}%;animation-delay:${i*45}ms"></i></div>
      </div>
      <div class="mval num">${money(v.usage)}</div>
    </div>`).join('');
}

function render(){
  const root = $('root');
  if(!S.key){
    root.innerHTML = `
      <div class="gate">
        <h1>OpenRouter usage, live</h1>
        <p>Paste a key to watch your credit balance draw down in real time.</p>
        <div class="field">
          <input id="key" type="password" aria-label="OpenRouter API key" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
          <button id="go" ${S.busy?'disabled':''}>${S.busy?'Checking…':'Start watching'}</button>
        </div>
        <p class="note">The key stays in this page's memory only — nothing is saved or sent anywhere but openrouter.ai. Closing the tab clears it. A management key also unlocks the 30-day history.</p>
        ${S.err?`<div class="err"><b>Couldn't reach OpenRouter</b>${esc(S.err)}</div>`:''}
      </div>`;
    $('go').onclick = connect;
    $('key').onkeydown = e => { if(e.key==='Enter') connect(); };
    // ponytail: paste is the only "provided" signal worth auto-firing on; typing a key by hand still needs Enter
    $('key').oninput = e => { if(e.inputType==='insertFromPaste' && e.target.value.trim()) connect(); };
    $('key').focus();
    return;
  }

  root.innerHTML = `
    <div class="meter">
      <div class="meter-top">
        <div>
          <div class="rate-label">Burn rate</div>
          <div class="rate num"><span data-torph="rate"></span><small>per hour</small></div>
        </div>
        <div class="facts">
          <div><div class="fact-v num"><span data-torph="remaining"></span></div><div class="fact-k">Credits left</div></div>
          <div><div class="fact-v num"><span data-torph="sessionSpend"></span></div><div class="fact-k">Spent in <span id="mins">0</span> min here</div></div>
          <div><div class="fact-v num"><span data-torph="runway"></span></div><div class="fact-k">At this pace</div></div>
        </div>
      </div>
      <svg class="spark" viewBox="0 0 ${SPARK_W} ${SPARK_H}" preserveAspectRatio="none" role="img" aria-label="Spend per check, most recent on the right">
        <line x1="0" y1="${SPARK_H-SPARK_PAD}" x2="${SPARK_W}" y2="${SPARK_H-SPARK_PAD}" stroke="var(--rule)" stroke-width="1"/>
        <g id="sparkbars"></g>
      </svg>
      <p class="sub" style="margin:6px 0 0">Spend per check · tallest bar <span id="sparkmax">—</span></p>
      <div class="tick"><span class="dot" id="dot"></span><span data-torph="tickstate"></span> ·
        <span data-torph="used"></span> used of <span data-torph="granted"></span> bought<span id="tickerr"></span></div>
    </div>

    <hr class="rule">
    <h2>Daily spend</h2>
    <p class="sub">Last 30 completed UTC days. Today's usage lands here tomorrow — the meter above is what covers right now.</p>
    ${S.activity ? dailyBars() : `<p class="empty">${esc(S.activityErr||'Loading…')}</p>`}

    ${S.activity ? `<hr class="rule"><h2>Where it went</h2><p class="sub">Top models by cost over the same window.</p><div class="models">${modelRows()}</div>` : ''}

    <div class="controls">
      <button class="ghost" id="toggle">${S.running?'Pause':'Resume'}</button>
      <button class="ghost" id="now">Check now</button>
      <label for="iv">Every</label>
      <input type="range" id="iv" min="0" max="${IVS.length-1}" step="1"
             value="${Math.max(0,IVS.indexOf(S.interval/1000))}"
             aria-label="Check interval" aria-valuetext="${ivText(S.interval)}">
      <span class="ivlabel num" data-torph="iv"></span>
      <button class="ghost" id="out" style="margin-left:auto">Forget key</button>
    </div>`;

  $('toggle').onclick = () => { S.running ? stop() : start(); paint(); };
  $('now').onclick = () => { poll(); if(S.activity===null) loadActivity(); };
  $('iv').oninput = e => {
    S.interval = IVS[Number(e.target.value)]*1000;
    e.target.setAttribute('aria-valuetext', ivText(S.interval));
    animateReadouts({iv: ivText(S.interval), tickstate: S.running?`Checking every ${ivText(S.interval)}`:'Paused'});
  };
  $('iv').onchange = () => { if(S.running) start(); };
  $('out').onclick = () => { stop(); S.key=null; S.credits=null; S.activity=null; S.activityErr=null;
    S.samples=[]; S.err=null; S.since=null; S.usedAtStart=null; S.morphValues={}; S.morphCurrent={}; render(); };

  paint();
}

// everything that changes on a poll — no innerHTML above the charts, so CSS can tween
function paint(){
  if(!S.key || !$('sparkbars')) return;
  const used = usedNow(), granted = grantedNow();
  const rate = burnRate();
  const runway = (rate && rate > 0) ? (granted - used)/rate : null;

  $('mins').textContent = S.since ? Math.round((Date.now()-S.since)/60000) : 0;
  $('dot').className = 'dot' + (S.running ? ' on' : '');
  $('toggle').textContent = S.running ? 'Pause' : 'Resume';

  $('tickerr').innerHTML = S.err ? ` · <span style="color:var(--warm)">${esc(S.err)}</span>` : '';
  paintSpark();

  animateReadouts({
    rate: rate==null?'—':money(rate),
    remaining: money(granted - used),
    sessionSpend: money(S.usedAtStart==null ? 0 : used - S.usedAtStart),
    runway: runway==null?'—':(runway>240?'240h+':runway.toFixed(1)+'h'),
    used: money(used),
    granted: money(granted),
    tickstate: S.running ? `Checking every ${ivText(S.interval)}` : 'Paused',
    iv: ivText(S.interval)
  });
}

// one node, follows the cursor, delegated off #root so it survives every re-render
const tip = document.createElement('div');
tip.className = 'tip';
tip.innerHTML = '<b></b><span></span>';
document.body.appendChild(tip);
const tipVal = tip.firstChild, tipWhen = tip.lastChild;
$('root').addEventListener('mousemove', e => {
  const el = e.target.closest?.('[data-tip]');
  if(!el){ tip.classList.remove('on'); return; }
  tipVal.textContent = el.dataset.tip;
  tipWhen.textContent = el.dataset.tipWhen || '';
  tip.classList.add('on');
  const box = tip.getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - box.width/2, 8), innerWidth - box.width - 8);
  const y = e.clientY - box.height - 14;
  tip.style.transform = `translate(${x.toFixed(0)}px,${(y<8 ? e.clientY+18 : y).toFixed(0)}px)`;
});
$('root').addEventListener('mouseleave', () => tip.classList.remove('on'));

render();
</script>
</body></html>
